
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supermarket-app
    restart: unless-stopped
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: supermarket
      PGUSER: supermarket_user
      PGPASSWORD: ${PGPASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      NODE_ENV: ${NODE_ENV:-development}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run migrate && npm start"]

  db:
    image: postgres:17-alpine
    container_name: supermarket-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: supermarket
      POSTGRES_USER: supermarket_user
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supermarket_user -d supermarket"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
