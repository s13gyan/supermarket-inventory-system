<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | SuperMart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="login-card">
        <p class="brand-mark">SuperMart</p>
        <h1>Welcome back</h1>
        <p class="login-intro">Sign in to manage your store inventory.</p>

        <form id="login-form">
            <label for="identifier">Email or username</label>
            <input id="identifier" name="identifier" autocomplete="username" required maxlength="150">

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">

            <p id="login-error" class="form-error" role="alert" aria-live="polite"></p>
            <button id="login-button" type="submit">Sign in</button>
        </form>
    </main>
    <script src="login.js"></script>
</body>
</html>
